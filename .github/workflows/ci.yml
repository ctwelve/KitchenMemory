name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build (macOS)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Build macOS app
        run: >-
          xcodebuild build
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Build documentation
        run: >-
          xcodebuild docbuild
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

  core-tests-macos:
    name: Core tests (macOS)
    needs: build-macos
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Test domain package
        run: swift test --package-path KitchenMemoryDomain

      - name: Test macOS core
        run: >-
          xcodebuild test
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -only-testing:KitchenMemoryTests
          CODE_SIGNING_ALLOWED=NO

  accessibility-macos:
    name: Accessibility (macOS)
    needs: build-macos
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Test macOS accessibility
        run: >-
          xcodebuild test
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -parallel-testing-enabled NO
          -only-testing:KitchenMemoryUITests
          CODE_SIGNING_ALLOWED=NO

  build-ios:
    name: Build (iOS)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Build iOS app
        run: >-
          xcodebuild build
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

  core-tests-ios:
    name: Core tests (iOS)
    needs: build-ios
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Test iOS core
        run: >-
          xcodebuild test
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -only-testing:KitchenMemoryTests
          CODE_SIGNING_ALLOWED=NO

  accessibility-ios:
    name: Accessibility (iOS)
    needs: build-ios
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Test iOS accessibility
        run: >-
          xcodebuild test
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -parallel-testing-enabled NO
          -only-testing:KitchenMemoryUITests
          CODE_SIGNING_ALLOWED=NO

  build-and-test:
    name: Build and test
    if: ${{ always() }}
    needs:
      - build-macos
      - core-tests-macos
      - build-ios
      - core-tests-ios
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required checks
        env:
          BUILD_MACOS_RESULT: ${{ needs.build-macos.result }}
          CORE_TESTS_MACOS_RESULT: ${{ needs.core-tests-macos.result }}
          BUILD_IOS_RESULT: ${{ needs.build-ios.result }}
          CORE_TESTS_IOS_RESULT: ${{ needs.core-tests-ios.result }}
        run: |
          test "$BUILD_MACOS_RESULT" = success
          test "$CORE_TESTS_MACOS_RESULT" = success
          test "$BUILD_IOS_RESULT" = success
          test "$CORE_TESTS_IOS_RESULT" = success
