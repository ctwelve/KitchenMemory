name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build (macOS)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Build macOS app
        run: >-
          xcodebuild -skipPackagePluginValidation build
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Build documentation
        run: >-
          xcodebuild -skipPackagePluginValidation docbuild
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -configuration Release
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

  core-tests-macos:
    name: Core tests (macOS)
    needs: build-macos
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Test macOS core
        run: >-
          xcodebuild -skipPackagePluginValidation test
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -only-testing:KitchenMemoryTests
          CODE_SIGNING_ALLOWED=NO

  build-ios:
    name: Build (iOS)
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Build iOS app
        run: >-
          xcodebuild -skipPackagePluginValidation build
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -configuration Release
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO

  core-tests-ios:
    name: Core tests (iOS)
    needs: build-ios
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report Xcode version
        run: xcodebuild -version

      - name: Test iOS core
        run: >-
          xcodebuild -skipPackagePluginValidation test
          -project KitchenMemory.xcodeproj
          -scheme KitchenMemory
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -only-testing:KitchenMemoryTests
          CODE_SIGNING_ALLOWED=NO
