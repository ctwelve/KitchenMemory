name: Development CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      analyze:
        description: Also run Clang static analysis on both platforms
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

concurrency:
  group: development-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'candidate' }}
  cancel-in-progress: true

jobs:
  decision:
    name: Select validation
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      tree: ${{ steps.decide.outputs.tree }}
      source_run: ${{ steps.decide.outputs.source_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby Tools/ci-evidence.rb decide

  repository:
    name: Repository contracts
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: /usr/bin/ruby Tools/check-repository.rb

  build:
    needs: decision
    if: needs.decision.outputs.mode == 'full'
    name: ${{ matrix.name || 'Production builds' }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: mac-build
            name: macOS — Production build
          - lane: ios-build
            name: iOS — Production build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pinned dependencies before executing package plugins
        run: /usr/bin/ruby Tools/check-software-inventory.rb
      - name: Record environment
        run: |
          mkdir -p build
          { sw_vers; xcodebuild -version; git rev-parse HEAD; } | tee build/environment.log
      - name: Build Production configuration
        env:
          CI_LANE: ${{ matrix.lane }}
        run: /usr/bin/ruby Tools/ci.rb "$CI_LANE" build/ci
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/environment.log
            build/ci/*.log
            build/ci/*.xcresult
          retention-days: 7

  core-tests:
    needs: decision
    if: needs.decision.outputs.mode == 'full'
    name: KitchenKit — Tests and coverage
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pinned dependencies before executing package plugins
        run: /usr/bin/ruby Tools/check-software-inventory.rb
      - name: Record environment
        run: |
          mkdir -p build
          { sw_vers; xcodebuild -version; git rev-parse HEAD; } | tee build/environment.log
      - name: Run framework tests, coverage, and public interface checks
        run: /usr/bin/ruby Tools/ci.rb core build/ci
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/environment.log
            build/ci/*.log
            build/ci/*.xcresult
          retention-days: 7

  ios-tests:
    needs: decision
    if: needs.decision.outputs.mode == 'full'
    name: iOS — App and UI tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pinned dependencies before executing package plugins
        run: /usr/bin/ruby Tools/check-software-inventory.rb
      - name: Record environment
        run: |
          mkdir -p build
          { sw_vers; xcodebuild -version; git rev-parse HEAD; } | tee build/environment.log
      - name: Run app and UI tests on the iPhone simulator
        run: /usr/bin/ruby Tools/ci.rb ios-tests build/ci
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/environment.log
            build/ci/*.log
            build/ci/*.xcresult
          retention-days: 7

  analysis:
    name: ${{ matrix.name || 'Static analysis' }}
    if: github.event_name == 'workflow_dispatch' && inputs.analyze
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: mac
            name: macOS — Static analysis
          - platform: ios
            name: iOS — Static analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ruby Tools/check-software-inventory.rb
      - env:
          CI_LANE: ${{ matrix.platform }}-analyze
        run: ruby Tools/ci.rb "$CI_LANE" build/analysis

  mac-tests:
    needs: decision
    name: macOS — App and UI tests
    # A fork cannot receive the CI signing identity. The aggregate fails closed.
    if: needs.decision.outputs.mode == 'full' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: xcode-27
    timeout-minutes: 30
    environment:
      name: ci-signing
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pinned dependencies before executing package plugins
        run: /usr/bin/ruby Tools/check-software-inventory.rb
      - name: Record environment
        run: |
          mkdir -p build
          { sw_vers; xcodebuild -version; git rev-parse HEAD; } | tee build/environment.log
      - name: Import dedicated development identity
        env:
          CI_CERTIFICATE_P12_BASE64: ${{ secrets.CI_CERTIFICATE_P12_BASE64 }}
          CI_CERTIFICATE_PASSWORD: ${{ secrets.CI_CERTIFICATE_PASSWORD }}
        run: /usr/bin/ruby Tools/ci-signing.rb import
      - name: Run app and UI tests
        run: /usr/bin/ruby Tools/ci.rb mac-tests build/ci
      - name: Remove temporary signing identity
        if: always()
        run: /usr/bin/ruby Tools/ci-signing.rb cleanup
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/environment.log
            build/ci/*.log
            build/ci/*.xcresult
          retention-days: 7

  required:
    # Keep the required check name stable across every event. Ready PR edits
    # must reuse verified tree evidence or complete full validation.
    name: Development CI
    if: always()
    needs: [decision, repository, build, core-tests, ios-tests, mac-tests, analysis]
    runs-on: ubuntu-latest
    env:
      DECISION_RESULT: ${{ needs.decision.result }}
      VALIDATION_MODE: ${{ needs.decision.outputs.mode }}
      ANALYSIS_RESULT: ${{ needs.analysis.result }}
      SOURCE_RUN: ${{ needs.decision.outputs.source_run }}
      REPOSITORY_RESULT: ${{ needs.repository.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      CORE_TEST_RESULT: ${{ needs.core-tests.result }}
      IOS_TEST_RESULT: ${{ needs.ios-tests.result }}
      MAC_TEST_RESULT: ${{ needs.mac-tests.result }}
    steps:
      - name: Require successful validation
        run: |
          [[ "$DECISION_RESULT" == success && "$REPOSITORY_RESULT" == success ]] || exit 1
          [[ "$ANALYSIS_RESULT" == success || "$ANALYSIS_RESULT" == skipped ]] || exit 1
          case "$VALIDATION_MODE" in
            full)
              [[ "$BUILD_RESULT" == success && "$CORE_TEST_RESULT" == success && "$IOS_TEST_RESULT" == success && "$MAC_TEST_RESULT" == success ]] || exit 1
              ;;
            reuse)
              [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$BUILD_RESULT" == skipped && "$CORE_TEST_RESULT" == skipped && "$IOS_TEST_RESULT" == skipped && "$MAC_TEST_RESULT" == skipped ]] || exit 1
              echo "Reused full candidate validation from run $SOURCE_RUN."
              ;;
            fast)
              [[ "$BUILD_RESULT" == skipped && "$CORE_TEST_RESULT" == skipped && "$IOS_TEST_RESULT" == skipped && "$MAC_TEST_RESULT" == skipped ]] || exit 1
              echo 'Fast draft checks only; review-ready changes require full validation.'
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.decision.outputs.mode == 'full'
        with:
          persist-credentials: false
      - name: Record successful candidate tree
        if: needs.decision.outputs.mode == 'full'
        run: ruby Tools/ci-evidence.rb record validation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.decision.outputs.mode == 'full'
        with:
          name: validated-tree-${{ needs.decision.outputs.tree }}
          path: validation.json
          retention-days: 7
          overwrite: true
