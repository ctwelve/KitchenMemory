name: Pull request source policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  source-branch-policy:
    name: PR source policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == merge_group ]]; then
            echo "Source branches were checked before entering the merge queue."
            exit 0
          fi
          case "$HEAD_REF" in
            slice/*|bugs/*|release-eng/*)
              echo "Eligible pull-request source: $HEAD_REF"
              ;;
            *)
              echo "::error title=Ineligible pull-request source::Pull requests to main must come from slice/*, bugs/*, or release-eng/*. Rename $HEAD_REF before opening or updating the pull request."
              exit 1
              ;;
          esac
