name: Pull request source policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  source-branch-policy:
    name: PR source policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          case "$HEAD_REF" in
            slice/*|bugs/*)
              echo "Eligible pull-request source: $HEAD_REF"
              ;;
            *)
              echo "::error title=Ineligible pull-request source::Pull requests to main must come from slice/* or bugs/*. Rename $HEAD_REF before opening or updating the pull request."
              exit 1
              ;;
          esac
