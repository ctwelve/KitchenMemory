name: Collect Cloud release
on:
  status:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release/major.minor.patch tag
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  # Unrelated status events must not displace a queued collection run.
  group: release-collection-${{ (github.event_name == 'workflow_dispatch' || (github.event.state == 'success' && github.event.context == 'KitchenMemory | Tag to release/')) && 'candidate' || github.run_id }}
  cancel-in-progress: false
jobs:
  collect:
    name: Verify and collect Cloud release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.state == 'success' && github.event.context == 'KitchenMemory | Tag to release/')
    runs-on: xcode-27
    timeout-minutes: 30
    environment:
      name: release-collection
      deployment: false
    permissions:
      contents: write
      actions: read
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve completed release candidate
        run: /usr/bin/ruby Tools/resolve-cloud-release.rb
      - name: Verify release readiness
        run: /usr/bin/ruby Tools/prepare-release-collection.rb "$RELEASE_TAG"
      - name: Collect and verify notarized Mac artifact
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_RELEASE_WORKFLOW_ID: ${{ vars.ASC_RELEASE_WORKFLOW_ID }}
        run: /usr/bin/ruby Tools/collect-cloud-release.rb "$RELEASE_TAG" build/release
      - name: Prepare draft release
        run: /usr/bin/ruby Tools/prepare-release-collection.rb "$RELEASE_TAG" build/release
